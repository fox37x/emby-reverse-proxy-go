services:
  emby-proxy:
    image: ghcr.io/fox37x/emby-reverse-proxy-go:seek-fix
    container_name: emby-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
    environment:
      LISTEN_ADDR: ':8080'
      BLOCK_PRIVATE_TARGETS: 'true'
      # Conservative seek fix: original project used 50; this fork defaults to 200.
      UPSTREAM_MAX_CONNS_PER_HOST: '200'
