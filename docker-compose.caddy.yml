services:
  emby-proxy:
    image: ghcr.io/fox37x/emby-reverse-proxy-go:seek-fix
    container_name: emby-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
    environment:
      LISTEN_ADDR: ':8080'
      BLOCK_PRIVATE_TARGETS: 'true'
      # Seek-stable defaults baked into this fork; keep these unless you know why changing them.
      UPSTREAM_MAX_CONNS_PER_HOST: '0'
      UPSTREAM_MAX_IDLE_CONNS_PER_HOST: '100'
      UPSTREAM_RESPONSE_HEADER_TIMEOUT: '30s'
      UPSTREAM_FORCE_HTTP2: 'false'
